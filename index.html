<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CajaLab - Generador para corte laser</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="Vista previa">
        <header class="topbar">
          <div>
            <p class="eyebrow">CajaLab</p>
            <h1>Generador de cajas para corte laser</h1>
          </div>
          <div class="actions">
            <button class="icon-button" type="button" id="resetView" aria-label="Reiniciar vista" title="Reiniciar vista">
              <i data-lucide="rotate-ccw"></i>
            </button>
            <button class="primary-button" type="button" id="downloadSvg">
              <i data-lucide="download"></i>
              SVG
            </button>
            <button class="primary-button" type="button" id="downloadDxf">
              <i data-lucide="download"></i>
              DXF
            </button>
          </div>
        </header>

        <div class="preview-grid">
          <section class="model-panel" aria-label="Modelo 3D">
            <div class="scene" id="scene">
              <div class="box-model" id="boxModel">
                <div class="face face-front">Frente</div>
                <div class="face face-back">Atras</div>
                <div class="face face-right">Derecha</div>
                <div class="face face-left">Izquierda</div>
                <div class="face face-top">Arriba</div>
                <div class="face face-bottom">Abajo</div>
              </div>
            </div>
          </section>

          <section class="drawing-panel" aria-label="Plano SVG">
            <div class="drawing-head">
              <div class="drawing-title">
                <span>Plano 2D</span>
                <div class="segmented" aria-label="Modo de vista">
                  <button class="segment active" type="button" id="previewMode">Preview</button>
                  <button class="segment" type="button" id="cutMode">Corte</button>
                </div>
              </div>
              <output id="svgSize">0 x 0 mm</output>
            </div>
            <div class="svg-stage" id="svgStage"></div>
          </section>
        </div>
      </section>

      <aside class="controls" aria-label="Controles de caja">
        <div class="control-group">
          <h2>Medidas</h2>
          <label>
            Ancho
            <span class="field">
              <input type="number" id="width" min="20" max="800" step="1" value="180">
              <small>mm</small>
            </span>
          </label>
          <label>
            Fondo
            <span class="field">
              <input type="number" id="depth" min="20" max="800" step="1" value="120">
              <small>mm</small>
            </span>
          </label>
          <label>
            Alto
            <span class="field">
              <input type="number" id="height" min="20" max="800" step="1" value="80">
              <small>mm</small>
            </span>
          </label>
          <label>
            Grosor material
            <span class="field">
              <input type="number" id="thickness" min="1" max="20" step="0.1" value="3">
              <small>mm</small>
            </span>
          </label>
        </div>

        <div class="control-group">
          <h2>Uniones</h2>
          <label>
            Tipo
            <select id="jointType">
              <option value="finger">Dedos intercalados</option>
              <option value="plain">Canto recto</option>
            </select>
          </label>
          <label>
            Tamano de dedo
            <span class="field">
              <input type="number" id="finger" min="4" max="80" step="1" value="18">
              <small>mm</small>
            </span>
          </label>
          <label>
            Kerf
            <span class="field">
              <input type="number" id="kerf" min="0" max="1.5" step="0.01" value="0.12">
              <small>mm</small>
            </span>
          </label>
        </div>

        <div class="control-group">
          <h2>Caja</h2>
          <label class="switch-row">
            Sin tapa
            <input type="checkbox" id="openTop">
          </label>
          <label>
            Separacion del plano
            <span class="field">
              <input type="number" id="gap" min="4" max="60" step="1" value="12">
              <small>mm</small>
            </span>
          </label>
        </div>

        <div class="control-group">
          <h2>Exportacion</h2>
          <label>
            Color de corte
            <select id="cutColor">
              <option value="white">Blanco</option>
              <option value="red">Rojo</option>
              <option value="black">Negro</option>
            </select>
          </label>
          <label class="switch-row">
            Marcas internas
            <input type="checkbox" id="includeMarks">
          </label>
        </div>

        <div class="status-box">
          <span>Longitud estimada de corte</span>
          <strong id="cutLength">0 m</strong>
        </div>
      </aside>
    </main>
  </body>
</html>
